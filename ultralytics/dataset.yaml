# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /data1/zhaohaowei/peak_detection/data_process/detection_dataset/devided_auto_label_dataset
train: train  # train images (relative to 'path')
val: val  # val images (relative to 'path')
#val: val


# Classes
nc: 1  # number of classes
names: ['peak']  # class names

#设置关闭预训练权重，还需要在ultralytics/utils/checks.py中把第706行的assert注释掉，修改为return False
# pretrained: True
# flipud: 0.0
# fliplr: 0.5
# mosaic: 0.1
# mixup: 0.1
# erasing: 0.0
# overlap_mask: False
mosaic: 0.0
translate: 0.0
scale: 0.0 # (float) image scale (+/- gain)
shear: 0.0 # (float) image shear (+/- deg)
perspective: 0.0 # (float) image perspective (+/- fraction), range 0-0.001
flipud: 0.0 # (float) image flip up-down (probability)
fliplr: 0.0 # (float) image flip left-right (probability)
bgr: 0.0 # (float) image channel BGR (probability)
mixup: 0.0 # (float) image mixup (probability)
copy_paste: 0.0 # (float) segment copy-paste (probability)
copy_paste_mode: "flip" # (str) the method to do copy_paste augmentation (flip, mixup)
erasing: 0.0 # (float) probability of random erasing during classification training (0-0.9), 0 means no erasing, must be less than 1.0.
crop_fraction: 0.0 # (float) image crop fraction for classification (0.1-1), 1.0 means no crop, must be greater than 0.
overlap_mask: False
